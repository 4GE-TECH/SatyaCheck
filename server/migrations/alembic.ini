# Postgres schema migrations (Supabase). SQLite dev databases are patched by
# server/database.py:init_db instead.
#
#   DATABASE_ADMIN_URL=...  SATYACHECK_APP_DB_PASSWORD=...  \
#       alembic -c server/migrations/alembic.ini upgrade head
#
# The connection URL is never written here: env.py reads config.DATABASE_ADMIN_URL
# (environment or the git-ignored .env).

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
