# Held-out evaluation transcripts — the ground truth M4 is scored against.
#
# These are NEVER indexed. `Corpus.retrievable` and `Corpus.benign` both exclude
# kind: heldout, so retrieval cannot return them and P@3 is not scored against itself.
#
# Each is written as a caller would actually speak — mid-call, code-switched, with the
# hesitation and repetition of real speech — rather than as a description of a tactic.
# That matters: the corpus documents describe scams in advisory register, and if the
# held-out set were written the same way P@3 would measure register matching rather
# than retrieval. Phrasing is drawn from the tactics named in the harvested advisories,
# not copied from any indexed document.
#
# `expected_anchor` is the anchor the query should retrieve. `script` is tracked
# because Whisper's output script is unstable on code-switched audio, and retrieval has
# to survive both.

# --- digital arrest ----------------------------------------------------------

- id: held-digital-arrest-001
  kind: heldout
  scam_family: digital_arrest
  expected_anchor: anch-digital-arrest-001
  lang: en
  script: latin
  text: >-
    Sir, this is Inspector Deshmukh from the Cyber Crime branch, Colaba. A case has been
    registered against your Aadhaar number in a money laundering matter. You are now
    under digital arrest. Do not disconnect this video call and do not leave the room.
    You cannot inform anybody, not even your family, till the verification is complete.

- id: held-digital-arrest-002
  kind: heldout
  scam_family: digital_arrest
  expected_anchor: anch-digital-arrest-002
  lang: hi
  script: devanagari
  text: >-
    आपके नाम से एक गिरफ़्तारी वारंट निकला है। हम अभी आपको वीडियो कॉल पर डिजिटल अरेस्ट कर
    रहे हैं। कैमरा बंद मत कीजिए और किसी को फ़ोन मत कीजिए। जाँच पूरी होने तक पैसा एक सरकारी
    खाते में जमा करना होगा।

- id: held-digital-arrest-003
  kind: heldout
  scam_family: digital_arrest
  expected_anchor: anch-digital-arrest-001
  lang: hi_latn
  script: latin
  text: >-
    Main CBI se bol raha hoon. Aapke naam par ek parcel aur ek bank account mila hai
    jisme illegal transaction hua hai. Abhi ye call kaatna mat, aur ghar mein kisi ko mat
    batao. Verification ke liye paisa transfer karna padega warna arrest ho jayega.

