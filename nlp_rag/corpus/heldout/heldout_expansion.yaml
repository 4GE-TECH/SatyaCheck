# Held-out expansion — 16 to 50 queries, at least 5 per scam family.
#
# WHY THIS FILE EXISTS
# At 16 queries each one moved P@3 by 6.25%, so the difference between 85% and 100% was
# a single document. P@3 reported 100% while `sms_fraud` had *no* held-out query at all
# and three unvalidated variants. A metric that saturates has stopped measuring.
#
# NEVER INDEXED. `Corpus.retrievable` and `Corpus.benign` both exclude kind: heldout.
#
# Written in call register — mid-call, code-switched, with the hesitation and repetition
# of real speech. Some deliberately carry the artefacts faster-whisper actually produces:
# filler words, self-corrections, a repeated clause, a dropped subject. Retrieval has to
# survive transcription, not just clean prose.
#
# Ids ending -adv are ADVERSARIAL: a caller running a known playbook while avoiding the
# marker phrases. They are expected to be harder, and a miss on one is informative rather
# than embarrassing — it says the score is leaning on markers where retrieval should be
# carrying it.

