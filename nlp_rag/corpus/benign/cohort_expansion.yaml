# Benign cohort expansion — Block 1. Brings the cohort from 22 to 80.
#
# This set defines what "an ordinary call sounds like" for the s-norm, so the failure
# mode is a NARROW cohort, not an unpolished one. At 22 documents the std estimate on a
# scam query was 0.051 against a MIN_COHORT_STD floor of 0.05 — one document away from
# clamping, at which point the normaliser stops normalising and starts returning a
# constant.
#
# Several entries deliberately involve money, urgency, deadlines or identity without
# being scams. A cohort of nothing but pleasantries would make any transaction look
# anomalous, which is the same over-flagging failure from the other direction.

