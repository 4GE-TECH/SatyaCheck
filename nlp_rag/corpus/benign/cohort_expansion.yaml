# --- genuine but unusual: money, urgency, identity, without fraud ------------
# These are the hardest negatives in the set. Each involves a real payment request
# and each invites verification, which is what separates them from a scam script.

- id: benign-unusual-request-004
  kind: benign
  lang: en
  script: latin
  title: Genuine urgent money request, verifiable
  text: >-
    I am at the hospital with Meera, the admission counter wants twelve thousand as a
    deposit before they will start. Can you transfer it? Call me back on this number
    if you want to check, or speak to the duty nurse, I will hand her the phone.

- id: benign-unusual-request-005
  kind: benign
