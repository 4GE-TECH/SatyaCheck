  text: >-
    Maa, main office pahunch gaya hoon. Shaam ko ghar aa jaunga. Khana bana lena, aur
    papa se keh dena main dawai le aaunga.

- id: benign-family-003
  kind: benign
  lang: hi
  script: devanagari
  title: घर की बात
