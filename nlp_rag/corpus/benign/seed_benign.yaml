# --- genuine but unusual: the false-positive guard ---------------------------
- id: benign-unusual-request-001
  kind: benign
  lang: en
  script: latin
  title: Genuine unusual request, invites verification
  text: >-
    Papa, my wallet was stolen at the station and my cards are gone. Can you send me
    two thousand so I can get home? Call me back on this number to check it's me, or
    call Rohit, he is standing right here with me.

- id: benign-unusual-request-002
  kind: benign
  lang: hi_latn
  script: latin
  title: Genuine unusual request, Hinglish
  text: >-
    Papa, mera phone gir gaya tha aur card block ho gaya hai. Thoda paisa bhej dijiye,
    main ghar aake wapas kar dunga. Aap Rohit se baat kar lijiye, wo mere saath hai.

- id: benign-unusual-request-003
  kind: benign
  lang: en
  script: latin
  title: Hospital call from a real relative
  text: >-
    Bhaiya, Mummy has been admitted to Apollo for observation. Nothing serious but
    come when you can. You can talk to the doctor directly, I'll put him on, or call
    the hospital reception yourself.

