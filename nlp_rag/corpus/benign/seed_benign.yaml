# Benign cohort — ordinary calls that are not scams.
#
# This is the background distribution retrieval scores are s-normalised against. It is
# NOT decoration: without it, raw BGE-m3 cosines sit in a compressed band and every
# transcript scores mid-range. It doubles as the false-positive test set.
#
# Target size is ~80. Keep the mix broad — institutional, medical, delivery, family,
# wrong numbers, and genuine-but-unusual requests. Anything a real phone rings with.

# --- institutional / automated ----------------------------------------------
- id: benign-bank-ivr-001
  kind: benign
  lang: en
  script: latin
  title: Bank statement IVR
  text: >-
    Dear customer, your HDFC Bank statement for account ending 4402 is ready. Press 1
    to receive it on WhatsApp, or press 2 to return to the main menu.

- id: benign-bank-ivr-002
  kind: benign
  lang: en
  script: latin
  title: Credit card payment reminder
  text: >-
    This is an automated reminder that your credit card payment of four thousand two
    hundred rupees is due on the fifteenth. Please ignore this message if you have
    already paid.

- id: benign-insurance-001
  kind: benign
  lang: en
  script: latin
  title: Policy renewal reminder
  text: >-
    Good morning, I am calling from the insurance branch regarding your motor policy
    which is due for renewal next month. Would you like me to email the quote, or
    would you prefer to visit the branch?

- id: benign-telecom-ivr-001
  kind: benign
  lang: hi_latn
  script: latin
  title: Recharge reminder, Hinglish
  text: >-
    Namaste, aapka plan 3 din mein khatam ho raha hai. Recharge karne ke liye app
    kholiye ya nazdeeki store par jaaiye. Dhanyavaad.

# --- delivery / logistics ----------------------------------------------------
- id: benign-delivery-001
  kind: benign
  lang: en
  script: latin
  title: Delivery slot confirmation
  text: >-
    Hello sir, I am the delivery executive. Your parcel will be delivered between 4
    and 6 PM today. Please keep the door open, I will call when I reach downstairs.

- id: benign-delivery-002
