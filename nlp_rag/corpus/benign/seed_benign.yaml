  lang: hi_latn
  script: latin
  title: Delivery agent, Hinglish
  text: >-
    Hello, main delivery se bol raha hoon. Aapka order aa gaya hai, main building ke
    neeche khada hoon. Gate number bata dijiye.

- id: benign-delivery-003
  kind: benign
  lang: hi
  script: devanagari
  title: कूरियर कॉल
  text: >-
    नमस्ते, मैं कूरियर से बोल रहा हूँ। आपका पार्सल शाम तक पहुँच जाएगा। कोई दिक्कत हो
    तो इसी नंबर पर कॉल कर लीजिए।

# --- medical -----------------------------------------------------------------
