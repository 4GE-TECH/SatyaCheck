# Depth for the four families that recall measurement showed were starved.
#
# THE MEASUREMENT THAT PROMPTED THIS
# Held-out scam recall at the amber floor, broken down by family, tracked corpus depth
# almost perfectly:
#
#   family                  corpus docs   recall
#   qr_code_fraud                 5         20%
#   financial_fraud               5         20%
#   sms_fraud                     5         40%
#   kyc_update                    5         60%
#   digital_arrest               10         80%
#   family_emergency             10        100%
#   telecom_impersonation        15        100%
#
# Every family at 100% had 10-15 documents; every failing family had 5. That is the same
# starved-numerator mechanism §5.2 describes for languages, expressed per family: with
# five documents spread over three scripts, a query in any one script has at most two
# neighbours to match against, and `max_scam_cos` never rises far enough above the benign
# background to clear z0.
#
# Twenty documents, five per family, bringing each to 10 — level with digital_arrest and
# family_emergency. Weighted toward hi_latn (10 of 20), which is still the weakest
# language at 73.3% against 87.0% en and 91.7% hi even after the credential markers.
#
# Phrasing is distinct from every held-out transcript and from each anchor's existing
# variants. These buy *retrieval*, not memorisation: a document that paraphrases a
# held-out item too closely inflates P@3 without helping a real call.
#
# RUN `python -m nlp_rag.eval_retrieval` AFTER THIS. §5.2: growing the scam index raises
# max_scam_cos for every query including benign ones, so the benign false-positive rate
# is the number to watch and SCRIPT_Z0 may have to follow.

