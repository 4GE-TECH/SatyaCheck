# Second Latin-Hinglish variant per anchor — closing a measured recall gap.
#
# THE MEASUREMENT THAT PROMPTED THIS
# Held-out scam recall at the amber floor, broken down by language, tracked the
# scam:benign ratio of the corpus monotonically:
#
#   lang      scam  benign  ratio   recall
#   hi          14      17   0.82   83.3%
#   en          28      52   0.54   73.9%
#   hi_latn     14      34   0.41   33.3%
#
# Hinglish had the thinnest foreground against the thickest background, and the worst
# recall by a wide margin — at every value of SCRIPT_Z0, not only the current one. This
# is the same starved-numerator mechanism Devanagari had before its variants existed,
# and it stayed invisible until the harness gained a recall axis.
#
# Fourteen documents, one per indexed anchor, bringing hi_latn to 28 and its ratio to
# 0.82 — level with Devanagari. Phrasing is distinct from each anchor's first hi_latn
# variant and from every held-out transcript.

- id: var-digital-arrest-001-hi-latn-b
  kind: variant
  anchor_id: anch-digital-arrest-001
  derived: true
  scam_family: digital_arrest
  lang: hi_latn
  script: latin
  title: Digital arrest, money laundering framing, Latin Hinglish
  markers: [MK_AUTHORITY_IMPERSONATION, MK_ARREST_THREAT, MK_ISOLATION_DEMAND]
  text: >-
    Aapke naam se ek bank account khula hai jisme money laundering ka paisa aaya hai.
    Enforcement wale case bana rahe hain. Jab tak clearance nahi milta aap is call se
    hatt nahi sakte aur ghar mein kisi ko bata nahi sakte, warna sabooton se chhedchhad
    maana jayega.

