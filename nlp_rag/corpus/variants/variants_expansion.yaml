# Variant expansion — every indexed anchor gets a full en / hi_latn / hi_deva triple.
#
# Why triples, not more English: `z = (max_scam_cos - mean(benign_cos)) / std(benign_cos)`.
# The benign cohort is thoroughly multilingual (43 en / 27 hi_latn / 12 devanagari) but
# the scam corpus was 20/4/2, so a Devanagari call met a well-populated background and a
# nearly empty foreground and under-scored purely for being in Hindi.
# `tests/test_score.py::test_a_devanagari_scam_call_reaches_the_high_hit_target` is the
# guard; it failed at 0.63 before these documents existed.
#
# Hand-authored in all three scripts, NOT machine-transliterated. Running Devanagari
# through indic-transliteration yields `phona kisī ko mata denā`, which is not what
# Whisper emits on code-switched audio — it emits the spelling a person would type.
#
# Each is written in call register (what a caller says), not advisory register (what an
# agency writes). Phrasing is deliberately distinct from `corpus/heldout/`: a variant
# that paraphrases a held-out excerpt turns P@3 into a memorisation check.

