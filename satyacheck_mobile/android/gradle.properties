# Memory settings match what `flutter create` generates for Flutter 3.47.
#
# The trustStore flags are the local addition. AVG Antivirus on this machine terminates
# every HTTPS connection and re-signs it with its own root; Windows trusts that root, the
# JVM ships its own truststore and does not, so every Gradle artifact download failed with
# "PKIX path building failed". This is the same interception that blocked the HuggingFace
# model downloads and Playwright's Chromium fetch elsewhere in this project.
#
# Certificate verification stays fully ON — the JVM is told to trust what Windows already
# trusts. Never disable verification instead.
#
# On a machine without intercepting AV, drop the two -D flags. To rebuild the truststore:
#   keytool -importcert -alias avg-web-shield -file <exported-root.cer> \
#           -keystore %USERPROFILE%\.satyacheck\cacerts -storepass changeit
# sdkmanager spawns its own JVM and does not read this file, so the same flags are also
# needed in the JAVA_TOOL_OPTIONS environment variable — see INSTALL_CHECKLIST.md.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=C\:\\Users\\Nkroc\\.satyacheck\\cacerts -Djavax.net.ssl.trustStorePassword=changeit
# Pin the JDK Gradle builds with.
#
# Without this, Gradle's toolchain detection picks up the system Adoptium **JRE** and fails
# with "does not provide the required capabilities: [JAVA_COMPILER]" — a JRE has no javac.
# `flutter build` works regardless because Flutter passes its own configured JDK, but a
# direct `gradlew` invocation (which is how the unit tests run) does not.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
